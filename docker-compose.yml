services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fineduca
      POSTGRES_USER: fineduca
      POSTGRES_PASSWORD: fineduca_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fineduca_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fineduca -d fineduca"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  fineduca_postgres:
